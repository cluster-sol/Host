# Build Settings
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

permalink: /blog/:year/:month/:day/:title/

# Drafts (published: false) and future-dated posts stay out of production.
future: false

# Collections
collections:
  services:
    output: true
    permalink: /services/:slug/
  case_studies:
    output: true
    permalink: /work/:slug/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

paginate: 6
paginate_path: "/blog/page:num/"

# Files & Folders to Include
include:
  - _headers
  - _redirects
  - robots.txt
  - sitemap.xml
  - site.webmanifest
  - wrangler.toml
  - schema.sql
  - google-apps-script.js

# Files & Folders to Exclude from build output
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
  - .jekyll-cache/
  - README.md
  - webiste-plan.md
  - plan.md
  - node_modules/
  # Pages Functions are uploaded by Wrangler from the repo root; they must not
  # be copied into the static build output.
  - functions/
  - .github/
