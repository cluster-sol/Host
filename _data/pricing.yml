sprints:
  - id: "rapid-mvp"
    name: "Rapid MVP Sprint"
    badge: "Fastest Time-to-Market"
    duration: "3 Weeks"
    price_inr: "₹1,20,000"
    price_usd: "$1,800"
    target_audience: "Startups validating an idea or seeking seed capital."
    deliverables:
      - "Full Figma UI/UX Design System & clickable prototype"
      - "Production Next.js 15 Web App or Flutter Mobile App"
      - "Database setup (Supabase PostgreSQL / Cloudflare D1)"
      - "Authentication (Email, Magic Links, Google OAuth)"
      - "Payment integration (Stripe / Razorpay)"
      - "Production deployment on custom domain with SSL"
    cta: "Book MVP Sprint"

  - id: "enterprise-fullscale"
    name: "Enterprise Full-Scale Sprint"
    badge: "Most Popular"
    featured: true
    duration: "6 Weeks"
    price_inr: "₹3,50,000"
    price_usd: "$4,800"
    target_audience: "Funded startups & established businesses scaling operations."
    deliverables:
      - "Complete Web App + Mobile App (iOS & Android)"
      - "Custom AI Agent / RAG Knowledge Base integration"
      - "Internal Admin Command Center with RBAC & audit logs"
      - "Self-hosted n8n automation pipeline (up to 8 workflows)"
      - "Cloudflare Enterprise Edge caching & security setup"
      - "30-day post-launch warranty & team handover training"
    cta: "Start Enterprise Sprint"

  - id: "dedicated-squad"
    name: "Dedicated Engineering Squad"
    badge: "Continuous Evolution"
    duration: "Monthly Retainer"
    price_inr: "₹1,80,000/mo"
    price_usd: "$2,600/mo"
    target_audience: "Companies needing ongoing engineering firepower."
    deliverables:
      - "Dedicated Senior Full-Stack Engineer + AI Architect"
      - "Weekly sprint cycles, task planning, and Friday demos"
      - "Unlimited bug fixes, code reviews, and schema migrations"
      - "Direct Slack/WhatsApp channel access (same timezone)"
      - "No long-term lock-in (pause or cancel anytime with 15 days notice)"
      - "Priority emergency on-call support"
    cta: "Hire Dedicated Squad"

milestone_breakdown:
  - step: "40% Kickoff Advance"
    description: "Paid upon SOW signing to initiate UI/UX wireframing, architecture blueprints, and GitHub repo scaffolding."
  - step: "30% UAT Delivery"
    description: "Paid once the working staging build is deployed and all acceptance criteria pass user testing."
  - step: "30% Final Handover"
    description: "Paid upon DNS domain cutover, production release, and full repository & credential handover."
