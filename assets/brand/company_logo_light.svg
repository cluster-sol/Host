    <line x1="88" y1="27" x2="62" y2="42" stroke="url(#glowGradLight)" stroke-width="2.5" />
    <line x1="88" y1="73" x2="62" y2="58" stroke="url(#glowGradLight)" stroke-width="2.5" />
    <line x1="48" y1="96" x2="48" y2="65" stroke="url(#glowGradLight)" stroke-width="2.5" />
    <line x1="8" y1="73" x2="34" y2="58" stroke="url(#glowGradLight)" stroke-width="2.5" />
    <line x1="8" y1="27" x2="34" y2="42" stroke="url(#glowGradLight)" stroke-width="2.5" />

    <polygon points="48,36 60,43 60,57 48,64 36,57 36,43" 
