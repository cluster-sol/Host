    <circle cx="72" cy="36" r="3.5" fill="#818CF8" />
    <circle cx="72" cy="64" r="3.5" fill="#22D3EE" />
    <circle cx="48" cy="78" r="3.5" fill="#818CF8" />
    <circle cx="24" cy="64" r="3.5" fill="#22D3EE" />
    <circle cx="24" cy="36" r="3.5" fill="#818CF8" />
    <circle cx="48" cy="50" r="4" fill="#FFFFFF" />
