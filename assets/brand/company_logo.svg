<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Neural-Hexagon Cluster Icon -->
  <g transform="translate(15, 12)">
    <!-- Outer Hexagon Frame -->
    <polygon points="48,4 88,27 88,73 48,96 8,73 8,27" 
             fill="none" stroke="url(#techGrad)" stroke-width="4" stroke-linejoin="round" />
    
    <!-- Inner Circuit Lines -->
    <path d="M48,22 L72,36 L72,64 L48,78 L24,64 L24,36 Z" 
          fill="none" stroke="#CBD5E1" stroke-width="1.8" stroke-dasharray="2,2" />
    
    <line x1="48" y1="4" x2="48" y2="35" stroke="url(#glowGrad)" stroke-width="2.5" />
    <line x1="88" y1="27" x2="62" y2="42" stroke="url(#glowGrad)" stroke-width="2.5" />
    <line x1="88" y1="73" x2="62" y2="58" stroke="url(#glowGrad)" stroke-width="2.5" />
    <line x1="48" y1="96" x2="48" y2="65" stroke="url(#glowGrad)" stroke-width="2.5" />
    <line x1="8" y1="73" x2="34" y2="58" stroke="url(#glowGrad)" stroke-width="2.5" />
    <line x1="8" y1="27" x2="34" y2="42" stroke="url(#glowGrad)" stroke-width="2.5" />

    <!-- Central AI Core Hexagon -->
    <polygon points="48,36 60,43 60,57 48,64 36,57 36,43" 
             fill="url(#techGrad)" filter="url(#softGlow)" />

    <!-- Peripheral Quantum Dots -->
    <circle cx="48" cy="22" r="3.5" fill="#06B6D4" />
    <circle cx="72" cy="36" r="3.5" fill="#818CF8" />
    <circle cx="72" cy="64" r="3.5" fill="#06B6D4" />
    <circle cx="48" cy="78" r="3.5" fill="#818CF8" />
    <circle cx="24" cy="64" r="3.5" fill="#06B6D4" />
    <circle cx="24" cy="36" r="3.5" fill="#818CF8" />
    <circle cx="48" cy="50" r="4" fill="#FFFFFF" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(130, 20)">
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" font-size="34" font-weight="900" fill="#0F172A" letter-spacing="-0.5">
      CLUSTER<tspan fill="url(#techGrad)">SOL</tspan>
    </text>
    
    <text x="2" y="68" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10.5" font-weight="700" fill="#64748B" letter-spacing="3.2">
      AI &amp; TECH SOLUTIONS
    </text>

    <!-- Subtle Accent Micro-Bar -->
    <rect x="2" y="78" width="80" height="3" rx="1.5" fill="url(#techGrad)" />
  </g>
</svg>
