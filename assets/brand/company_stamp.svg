<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <!-- Top Arc Path -->
    <path id="topArc" d="M 42,160 A 118,118 0 1,1 278,160" />
    <!-- Bottom Arc Path -->
    <path id="bottomArc" d="M 278,160 A 118,118 0 1,1 42,160" />
  </defs>

  <!-- Slight rotation for authentic ink stamped appearance -->
  <g transform="rotate(-6, 160, 160)" fill="none" stroke="#1E3A8A">
    <!-- Outer Double Rings -->
    <circle cx="160" cy="160" r="148" stroke-width="4.5" />
    <circle cx="160" cy="160" r="141" stroke-width="1.5" stroke-dasharray="5,3" />
    
    <!-- Inner Ring -->
    <circle cx="160" cy="160" r="95" stroke-width="2.2" />

    <!-- Top Curved Legal Company Name -->
    <text fill="#1E3A8A" stroke="none" font-family="'Arial Black', 'Inter', sans-serif" font-size="12.5" font-weight="900" letter-spacing="2">
      <textPath href="#topArc" startOffset="50%" text-anchor="middle">
        ★ CLUSTER AI TECHNOLOGIES PVT. LTD. ★
      </textPath>
    </text>

    <!-- Bottom Curved Location & Registration -->
    <text fill="#1E3A8A" stroke="none" font-family="'Arial', 'Inter', sans-serif" font-size="11.5" font-weight="700" letter-spacing="2.8">
      <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">
        NEW DELHI • INDIA • ESTD 2026
      </textPath>
    </text>

    <!-- Center Box Boundaries -->
    <line x1="72" y1="138" x2="248" y2="138" stroke-width="1.8" />
    <line x1="72" y1="182" x2="248" y2="182" stroke-width="1.8" />

    <!-- Center Header Text -->
    <text x="160" y="118" fill="#1E3A8A" stroke="none" font-family="'Courier New', monospace" font-size="10.5" font-weight="bold" text-anchor="middle" letter-spacing="1.5">
      OFFICIAL SEAL
    </text>

    <!-- Center Signatory Box -->
    <text x="160" y="156" fill="#1E3A8A" stroke="none" font-family="'Arial', sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="1.8">
      AUTHORIZED
    </text>
    <text x="160" y="173" fill="#1E3A8A" stroke="none" font-family="'Arial', sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="1.8">
      SIGNATORY
    </text>

    <!-- Sub-text Reference & CIN -->
    <text x="160" y="202" fill="#1E3A8A" stroke="none" font-family="'Courier New', monospace" font-size="8.8" font-weight="bold" text-anchor="middle">
      CIN: U72900DL2026PTC089214
    </text>
    <text x="160" y="215" fill="#1E3A8A" stroke="none" font-family="'Courier New', monospace" font-size="9" font-weight="bold" text-anchor="middle" letter-spacing="1">
      VERIFIED &amp; APPROVED
    </text>
  </g>
</svg>
